
spring.application.name=spring-security-template

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/spring_security_template
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}


# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=3600000

# JWT Cookie Configuration
spring.app.jwtCookieName=springSecurityTemplate
spring.app.jwtCookiePath=/api
spring.app.jwtCookieHttpOnly=true
spring.app.jwtCookieSecure=false
spring.app.jwtCookieSameSite=Lax

# Logging Configuration
logging.level.com.example.springsecuritytemplate=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=TRACE
